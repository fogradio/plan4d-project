# Sample workflow for building and deploying an Astro site to GitHub Pages
#
# To get started with Astro see: https://docs.astro.build/en/getting-started/
#
name: Deploy Astro site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "." # default value when not using subfolders
  # BUILD_PATH: subfolder

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            echo "lockfile=yarn.lock" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            echo "lockfile=package-lock.json" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: ${{ env.BUILD_PATH }}/${{ steps.detect-package-manager.outputs.lockfile }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
        working-directory: ${{ env.BUILD_PATH }}
      - name: Restore Plan4D media
        if: ${{ vars.PLAN4D_RESULTS_ARCHIVE_URL != '' }}
        env:
          PLAN4D_RESULTS_ARCHIVE_URL: ${{ vars.PLAN4D_RESULTS_ARCHIVE_URL }}
        run: |
          curl --fail --location "$PLAN4D_RESULTS_ARCHIVE_URL" --output "$RUNNER_TEMP/plan4d-results.tar.gz"
          tar -xzf "$RUNNER_TEMP/plan4d-results.tar.gz" -C public
        working-directory: ${{ env.BUILD_PATH }}
      - name: Restore Plan4D teaser
        env:
          PLAN4D_TEASER_ARCHIVE_URL: https://github.com/fogradio/plan4d-project/releases/download/plan4d-teaser-20261015/plan4d-teaser-20261015-release.tar.gz
          PLAN4D_TEASER_ARCHIVE_SHA256: 431aa1138690b4b1d168f95711477df16a0601c22b65b2a755c0b6a0acb27b88
        run: |
          curl --fail --location --retry 3 "$PLAN4D_TEASER_ARCHIVE_URL" --output "$RUNNER_TEMP/plan4d-teaser.tar.gz"
          printf '%s  %s\n' "$PLAN4D_TEASER_ARCHIVE_SHA256" "$RUNNER_TEMP/plan4d-teaser.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/plan4d-teaser.tar.gz" -C public
        working-directory: ${{ env.BUILD_PATH }}
      - name: Restore Plan4D future teaser
        env:
          PLAN4D_FUTURE_TEASER_ARCHIVE_URL: https://github.com/fogradio/plan4d-project/releases/download/plan4d-future-teaser-20261015/plan4d-future-teaser-20261015-release.tar.gz
          PLAN4D_FUTURE_TEASER_ARCHIVE_SHA256: 646c6f704ced9ceeb076266eb46f4e92b929bda7c7e9caf9f89ad4931a70dc7a
        run: |
          curl --fail --location --retry 3 "$PLAN4D_FUTURE_TEASER_ARCHIVE_URL" --output "$RUNNER_TEMP/plan4d-future-teaser.tar.gz"
          printf '%s  %s\n' "$PLAN4D_FUTURE_TEASER_ARCHIVE_SHA256" "$RUNNER_TEMP/plan4d-future-teaser.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/plan4d-future-teaser.tar.gz" -C public
        working-directory: ${{ env.BUILD_PATH }}
      - name: Restore additional aggregated comparisons
        if: ${{ vars.PLAN4D_AGGREGATES_ARCHIVE_URL != '' }}
        env:
          PLAN4D_AGGREGATES_ARCHIVE_URL: ${{ vars.PLAN4D_AGGREGATES_ARCHIVE_URL }}
          PLAN4D_AGGREGATES_ARCHIVE_SHA256: ${{ vars.PLAN4D_AGGREGATES_ARCHIVE_SHA256 }}
        run: |
          test -n "$PLAN4D_AGGREGATES_ARCHIVE_SHA256"
          curl --fail --location --retry 3 "$PLAN4D_AGGREGATES_ARCHIVE_URL" --output "$RUNNER_TEMP/plan4d-aggregates.tar.gz"
          printf '%s  %s\n' "$PLAN4D_AGGREGATES_ARCHIVE_SHA256" "$RUNNER_TEMP/plan4d-aggregates.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/plan4d-aggregates.tar.gz" -C public
        working-directory: ${{ env.BUILD_PATH }}
      - name: Restore Plan4D nine-case future teaser
        env:
          PLAN4D_FUTURE_GRID_ARCHIVE_URL: https://github.com/fogradio/plan4d-project/releases/download/plan4d-future-grid-20261017/plan4d-future-grid-20261017-release.tar.gz
          PLAN4D_FUTURE_GRID_ARCHIVE_SHA256: e01c5ffe9db0c8541c6636f21a0d100f570c515685f0826867fe4f47f46acb6c
        run: |
          curl --fail --location --retry 3 "$PLAN4D_FUTURE_GRID_ARCHIVE_URL" --output "$RUNNER_TEMP/plan4d-future-grid.tar.gz"
          printf '%s  %s\n' "$PLAN4D_FUTURE_GRID_ARCHIVE_SHA256" "$RUNNER_TEMP/plan4d-future-grid.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/plan4d-future-grid.tar.gz" -C public
        working-directory: ${{ env.BUILD_PATH }}
      - name: Restore Plan4D deduplicated 4D-only teaser
        env:
          PLAN4D_FUTURE_GRID_ONLY_ARCHIVE_URL: https://github.com/fogradio/plan4d-project/releases/download/plan4d-future-grid-4d-only-20261018/plan4d-future-grid-4d-only-20261018-release.tar.gz
          PLAN4D_FUTURE_GRID_ONLY_ARCHIVE_SHA256: 55741e079ec5087210260fc5569fd0701b4c59df2eabc54e06b202f9f2a9c203
        run: |
          curl --fail --location --retry 3 "$PLAN4D_FUTURE_GRID_ONLY_ARCHIVE_URL" --output "$RUNNER_TEMP/plan4d-future-grid-only.tar.gz"
          printf '%s  %s\n' "$PLAN4D_FUTURE_GRID_ONLY_ARCHIVE_SHA256" "$RUNNER_TEMP/plan4d-future-grid-only.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/plan4d-future-grid-only.tar.gz" -C public
        working-directory: ${{ env.BUILD_PATH }}
      - name: Build with Astro
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          node scripts/build.mjs \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
        working-directory: ${{ env.BUILD_PATH }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
